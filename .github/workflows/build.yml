name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish, e.g. v1.0.1 (leave empty to only build)'
        required: false
        default: ''

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write  # only used to publish a release
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DWAVESIPHON_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test WAV writer
        run: |
          mkdir -p wavtest
          ./build/Release/wav_writer_test.exe wavtest
          python tests/check_wav.py wavtest

      - name: Upload WaveSiphon.exe
        uses: actions/upload-artifact@v4
        with:
          name: WaveSiphon
          path: build/Release/WaveSiphon.exe

      - name: Check release version
        if: env.RELEASE_TAG != ''
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like v1.2.3 (got '$RELEASE_TAG')"
            exit 1
          fi

      # Runs for pushed v* tags, or from "Run workflow" with a version
      # (the tag is then created on the commit that was built).
      - name: Publish release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: WaveSiphon ${{ env.RELEASE_TAG }}
          body_path: .github/release-notes.md
          files: build/Release/WaveSiphon.exe

  mingw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix
      - name: Build
        run: ./build-mingw.sh
