name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write  # only used to publish a release for v* tags
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DWAVESIPHON_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test WAV writer
        run: |
          mkdir -p wavtest
          ./build/Release/wav_writer_test.exe wavtest
          python tests/check_wav.py wavtest

      - name: Upload WaveSiphon.exe
        uses: actions/upload-artifact@v4
        with:
          name: WaveSiphon
          path: build/Release/WaveSiphon.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Release/WaveSiphon.exe

  mingw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix
      - name: Build
        run: ./build-mingw.sh
